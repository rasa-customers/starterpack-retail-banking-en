version: "3.1"

slots:
  current_date:
    type: text
  username:
    type: text
  email_address:
    type: text
  physical_address:
    type: text
  segment:
    type: text

actions:
  - action_session_start

responses:
  utter_chitchat:
    - text: "Hello, how can I help you today?"
      metadata:
        rephrase: True
  # Used by the pattern_continue_interrupted override (data/system/patterns) to
  # auto-resume an interrupted flow after a digression, instead of asking the
  # user to confirm.
  utter_flow_continue_interrupted:
    - text: "Let's continue where we left off."
      metadata:
        rephrase: True
