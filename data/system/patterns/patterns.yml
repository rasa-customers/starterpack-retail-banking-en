flows:
  pattern_search:
    description: Handle knowledge-based requests using enterprise search
    steps:
      - action: action_trigger_search

  pattern_chitchat:
    description: Handle chitchat related questions
    steps:
      - action: utter_chitchat

  pattern_completed:
    description: A flow has been completed and there is nothing else to be done
    steps:
      - noop: true
        next: END

  # Auto-resume an interrupted flow instead of asking the user to confirm.
  # This keeps digressions (e.g. checking payees mid-transfer) friction-free for
  # demos and restores the deterministic "continue where we left off" behaviour.
  pattern_continue_interrupted:
    description: Flow for continuing an interrupted flow
    steps:
      - action: utter_flow_continue_interrupted

  pattern_session_start:
    description: Flow for starting the conversation
    name: pattern session start
    nlu_trigger:
        - intent: session_start
    steps:
      - action: utter_greeting
      - action: utter_show_greeting_accordion
